[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataefficiency"
version = "0.1.0"
description = "DataEfficiency project environment"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.5.1",
    "deepspeed>=0.16.5",
    "ipykernel>=6.29.5",
    "notebook",
    "wandb==0.18.5",
    "accelerate",
    "matplotlib",
    "transformers==4.45.2",
    "peft==0.16.0",
    "datasets==3.6.0",
    "trl==0.11.4",
    "bitsandbytes>=0.45.5",
    "evaluate==0.4.5",
    "scikit-learn",
    "statsmodels",
    "rouge-score",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.3/flash_attn-2.7.3+cu12torch2.5cxx11abiFALSE-cp310-cp310-linux_x86_64.whl"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["scripts", "utils"]
